<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Morning Back">
<meta name="theme-color" content="#1d1630">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Morning Back</title>
<style>
/* Dawn: deep plum night fading into a peach horizon. One soft glow, cream line art, rounded type. */
:root {
  --night: #1d1630;
  --plum: #2e2140;
  --dusk: #55344f;
  --horizon: #8a5560;
  --peach: #eeb090;
  --cream: #f6ead8;
  --cream-2: rgba(246, 234, 216, .62);
  --cream-3: rgba(246, 234, 216, .32);
  --cream-4: rgba(246, 234, 216, .12);
  --font: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--night);
  background-image:
    radial-gradient(120% 60% at 50% 115%, rgba(238, 176, 144, .38), transparent 60%),
    linear-gradient(172deg, var(--night) 0%, var(--plum) 42%, var(--dusk) 78%, var(--horizon) 100%);
  color: var(--cream);
  font-family: var(--font);
  overflow: hidden;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  touch-action: manipulation;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--peach); outline-offset: 4px; border-radius: 999px; }

.screen {
  position: fixed; inset: 0;
  padding: calc(env(safe-area-inset-top, 0px) + 5vh) calc(env(safe-area-inset-right, 0px) + 6vw) calc(env(safe-area-inset-bottom, 0px) + 4vh) calc(env(safe-area-inset-left, 0px) + 6vw);
  display: flex; flex-direction: column;
  transition: opacity .8s ease;
}
.screen[hidden] { display: none !important; }

/* ---------- start & done ---------- */
.center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3.2vh; text-align: center; }
.greet { font-size: clamp(40px, 6.4vw, 76px); font-weight: 600; letter-spacing: -.01em; margin: 0; line-height: 1.05; }
.sub { font-size: clamp(17px, 1.8vw, 22px); color: var(--cream-2); margin: 0; }
.begin {
  width: clamp(120px, 13vw, 168px); aspect-ratio: 1; border-radius: 50%;
  border: 1.5px solid rgba(238, 176, 144, .7);
  background: radial-gradient(circle, rgba(238, 176, 144, .28), rgba(238, 176, 144, .06) 70%);
  font-size: clamp(20px, 2vw, 26px); font-weight: 600; letter-spacing: .02em;
  box-shadow: 0 0 60px rgba(238, 176, 144, .25);
  animation: pulse 6s ease-in-out infinite;
  margin-block: 1.5vh;
}
@keyframes pulse { 0%, 100% { transform: scale(1); box-shadow: 0 0 40px rgba(238,176,144,.18); } 50% { transform: scale(1.04); box-shadow: 0 0 80px rgba(238,176,144,.32); } }
.week { display: flex; gap: 18px; }
.day { display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 13px; color: var(--cream-3); letter-spacing: .06em; }
.day i { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--cream-3); display: block; transition: background .6s, border-color .6s; }
.day.on i { background: var(--peach); border-color: var(--peach); }
.day.today { color: var(--cream-2); }
.quiet { color: var(--cream-3); font-size: 16px; padding: 10px 18px; }

/* ---------- session ---------- */
.session-main { flex: 1; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); align-items: center; gap: 5vw; min-height: 0; }
.stage { position: relative; width: min(66vh, 44vw); aspect-ratio: 1; justify-self: center; }
.stage > * { position: absolute; inset: 0; width: 100%; height: 100%; }
.breath {
  inset: 9%; width: auto; height: auto; border-radius: 50%;
  background: radial-gradient(circle, rgba(238, 176, 144, .30) 0%, rgba(238, 176, 144, .10) 55%, transparent 72%);
  transform: scale(.7); will-change: transform; transition: opacity .6s, transform .1s linear;
}
.ring-bg { stroke: var(--cream-4); }
.ring-fg { stroke: var(--peach); transition: stroke-dashoffset .25s linear; }
.figure { inset: 18%; width: auto; height: auto; transition: opacity .6s; }
.figure svg { width: 100%; height: 100%; overflow: visible; }
.figure .b { stroke: var(--cream); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
.figure .h { fill: var(--cream); }
.figure .mat { fill: var(--cream); opacity: .14; }
.figure .pil { fill: var(--cream); opacity: .22; }
.figure .m { stroke: var(--peach); stroke-width: 3; fill: none; stroke-linecap: round; opacity: .9; }
.figure .mh { fill: var(--peach); opacity: .9; }
.figure .far { opacity: .45; }
.figure .eye { stroke: var(--night); stroke-width: 1.3; fill: none; stroke-linecap: round; }
.figure .blush { fill: var(--peach); opacity: .85; }
.specks { pointer-events: none; opacity: 0; transition: opacity 1.2s; }
.working .specks { opacity: 1; }
.specks i { position: absolute; bottom: 22%; width: 5px; height: 5px; border-radius: 50%; background: var(--peach); opacity: 0; animation: speck 9s linear infinite; }
.specks i:nth-child(1) { left: 22%; animation-delay: 0s; }
.specks i:nth-child(2) { left: 38%; animation-delay: 1.6s; width: 3px; height: 3px; }
.specks i:nth-child(3) { left: 52%; animation-delay: 3.1s; }
.specks i:nth-child(4) { left: 64%; animation-delay: 4.7s; width: 4px; height: 4px; }
.specks i:nth-child(5) { left: 76%; animation-delay: 6.2s; width: 3px; height: 3px; }
.specks i:nth-child(6) { left: 30%; animation-delay: 7.6s; width: 4px; height: 4px; }
@keyframes speck { 0% { transform: translate(0, 0); opacity: 0; } 15% { opacity: .55; } 50% { transform: translate(8px, -110px); } 85% { opacity: .3; } 100% { transform: translate(-4px, -220px); opacity: 0; } }
.sun { width: 120px; height: 60px; overflow: visible; }
.rise { animation: rise 2.6s cubic-bezier(.2, .7, .2, 1) .3s both; }
@keyframes rise { from { transform: translateY(22px); } to { transform: translateY(0); } }
.twinkle circle { fill: var(--cream); animation: twinkle 2.4s ease-in-out infinite; }
.twinkle circle:nth-child(2) { animation-delay: .6s; } .twinkle circle:nth-child(3) { animation-delay: 1.2s; } .twinkle circle:nth-child(4) { animation-delay: 1.8s; }
@keyframes twinkle { 0%, 100% { opacity: .1; } 50% { opacity: .9; } }
.resting .figure { opacity: .45; }

.text { display: flex; flex-direction: column; gap: 2.2vh; min-width: 0; max-width: 34em; }
.eyebrow { font-size: clamp(14px, 1.3vw, 17px); letter-spacing: .14em; text-transform: uppercase; color: var(--peach); opacity: .85; }
.name { font-size: clamp(34px, 4.2vw, 56px); font-weight: 600; line-height: 1.08; margin: 0; letter-spacing: -.01em; }
.cue { font-size: clamp(18px, 1.75vw, 23px); line-height: 1.45; color: var(--cream-2); margin: 0; }
.status { margin-top: 2vh; display: flex; flex-direction: column; gap: 1vh; }
.big { font-size: clamp(28px, 3.2vw, 42px); font-weight: 500; line-height: 1.15; min-height: 2.3em; font-variant-numeric: tabular-nums; }
.meta { font-size: clamp(16px, 1.5vw, 19px); color: var(--cream-2); font-variant-numeric: tabular-nums; min-height: 1.3em; }

.foot { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-top: 2vh; }
.dots { display: flex; gap: 10px; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--cream-4); display: block; transition: background .4s, transform .4s; }
.dots i.done { background: var(--cream-3); }
.dots i.now { background: var(--peach); transform: scale(1.35); }
.hint { color: var(--cream-3); font-size: 14px; letter-spacing: .04em; }
.skip { color: var(--cream-2); font-size: 17px; padding: 12px 6px 12px 20px; }

.pause {
  position: fixed; inset: 0; z-index: 5;
  background: rgba(20, 15, 34, .72);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3vh; text-align: center;
}
.pause[hidden] { display: none !important; }
.pause h2 { margin: 0; font-size: clamp(36px, 4.6vw, 58px); font-weight: 600; }
.pause .end { margin-top: 4vh; border: 1.5px solid var(--cream-3); border-radius: 999px; padding: 12px 28px; color: var(--cream-2); font-size: 17px; }

@media (max-aspect-ratio: 1/1) {
  .session-main { grid-template-columns: minmax(0, 1fr); align-content: center; gap: 4vh; }
  .stage { width: min(44vh, 80vw); }
  .text { text-align: center; align-items: center; justify-self: center; }
  .hint { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .begin, .specks i, .rise, .twinkle circle { animation: none; }
}
</style>
</head>
<body>

<section class="screen" id="start">
  <div class="center">
    <svg class="sun" viewBox="0 0 84 42" aria-hidden="true">
      <path d="M8 40 A34 34 0 0 1 76 40" fill="none" stroke="#eeb090" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M22 40 A20 20 0 0 1 62 40" fill="rgba(238,176,144,.45)"/>
      <path d="M33 33 q3 2.4 6 0 M45 33 q3 2.4 6 0" fill="none" stroke="#1d1630" stroke-width="1.4" stroke-linecap="round"/>
      <line x1="2" y1="40.5" x2="82" y2="40.5" stroke="rgba(246,234,216,.35)" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    <h1 class="greet" id="greet">Good morning</h1>
    <p class="sub" id="summary">8 exercises</p>
    <button class="begin" id="begin" type="button">Begin</button>
    <div class="week" id="week-start"></div>
  </div>
</section>

<section class="screen" id="session" hidden>
  <div class="session-main">
    <div class="stage" id="stage">
      <div class="breath" id="breath"></div>
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <circle class="ring-bg" cx="50" cy="50" r="47" fill="none" stroke-width="1"/>
        <circle class="ring-fg" id="ring" cx="50" cy="50" r="47" fill="none" stroke-width="1.6" stroke-linecap="round"
                transform="rotate(-90 50 50)" stroke-dasharray="295.31" stroke-dashoffset="295.31"/>
      </svg>
      <div class="specks" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div class="figure"><svg viewBox="0 0 200 110" id="figure"><rect class="mat" x="8" y="89" width="184" height="6" rx="3"/><g id="figure-body"></g></svg></div>
    </div>
    <div class="text">
      <div class="eyebrow" id="eyebrow"></div>
      <h2 class="name" id="name"></h2>
      <p class="cue" id="cue"></p>
      <div class="status">
        <div class="big" id="big"></div>
        <div class="meta" id="meta"></div>
      </div>
    </div>
  </div>
  <div class="foot">
    <div class="dots" id="dots"></div>
    <div class="hint">Tap anywhere to pause</div>
    <button class="skip" id="skip" type="button">Skip ›</button>
  </div>
  <div class="pause" id="pause" hidden>
    <h2>Paused</h2>
    <p class="sub">Tap anywhere to continue</p>
    <button class="end" id="end" type="button">End session</button>
  </div>
</section>

<section class="screen" id="done" hidden>
  <div class="center">
    <svg class="sun" viewBox="0 0 84 42" aria-hidden="true">
      <path d="M8 40 A34 34 0 0 1 76 40" fill="none" stroke="#eeb090" stroke-width="2.5" stroke-linecap="round"/>
      <clipPath id="horizon"><rect x="0" y="-20" width="84" height="60.5"/></clipPath>
      <g clip-path="url(#horizon)"><g class="rise">
        <path d="M22 40 A20 20 0 0 1 62 40" fill="#eeb090"/>
        <path d="M33 34 q3 -3 6 0 M45 34 q3 -3 6 0" fill="none" stroke="#1d1630" stroke-width="1.4" stroke-linecap="round"/>
        <circle cx="31" cy="37" r="1.8" fill="#e58a7a"/><circle cx="53" cy="37" r="1.8" fill="#e58a7a"/>
      </g></g>
      <g class="twinkle"><circle cx="12" cy="14" r="1.6"/><circle cx="74" cy="8" r="1.3"/><circle cx="66" cy="22" r="1"/><circle cx="20" cy="2" r="1"/></g>
      <line x1="2" y1="40.5" x2="82" y2="40.5" stroke="rgba(246,234,216,.35)" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    <h1 class="greet">Well done</h1>
    <p class="sub">Your back will thank you. Tonight: a pillow under your knees.</p>
    <div class="week" id="week-done" style="margin-top:2vh"></div>
    <button class="quiet" id="home" type="button">Close</button>
  </div>
</section>

<script src="routine.js"></script>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };

  // ---------- figures (viewBox 0 0 200 110, mat at y≈90) ----------
  // Each figure is a set of joints in a resting pose (a) and an active pose (b); the drawing blends between them.
  function mix(a, b, m) {
    var o = {};
    for (var k in a) o[k] = b && b[k] ? [a[k][0] + (b[k][0] - a[k][0]) * m, a[k][1] + (b[k][1] - a[k][1]) * m] : a[k];
    return o;
  }
  function pt(p) { return p[0].toFixed(1) + " " + p[1].toFixed(1); }
  function line() {
    var d = "M" + pt(arguments[0]);
    for (var i = 1; i < arguments.length; i++) d += " L" + pt(arguments[i]);
    return d;
  }
  function curve(from, ctrl, to) { return "M" + pt(from) + " Q" + pt(ctrl) + " " + pt(to); }
  function limb(d, far) { return '<path class="b' + (far ? " far" : "") + '" d="' + d + '"/>'; }
  function pillow(x, y, w, h) { return '<rect class="pil" x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="' + h / 2 + '"/>'; }
  // A sleepy, content face: closed smiling eyes and a blush. look: degrees the face points (0 = right, -90 = up), or "front".
  // Only the features' positions turn with the head; the eye arc stays level so it always reads as a closed eye.
  function head(p, r, look, flip) {
    var html = '<circle class="h" cx="' + p[0] + '" cy="' + p[1] + '" r="' + r + '"/>';
    function at(x, y) {
      if (flip) x = -x;
      var a = (flip ? -look : look) * Math.PI / 180;
      return [p[0] + x * Math.cos(a) - y * Math.sin(a), p[1] + x * Math.sin(a) + y * Math.cos(a)];
    }
    function eye(c) { return '<path class="eye" d="M' + pt([c[0] - 1.7, c[1]]) + ' q1.7 1.5 3.4 0"/>'; }
    function blush(c, size) { return '<circle class="blush" cx="' + c[0].toFixed(1) + '" cy="' + c[1].toFixed(1) + '" r="' + size + '"/>'; }
    if (look === "front") return html + eye([p[0] - 3, p[1] - 1]) + eye([p[0] + 3, p[1] - 1]) + blush([p[0] - 4.4, p[1] + 2.6], 1.5) + blush([p[0] + 4.4, p[1] + 2.6], 1.5);
    return html + eye(at(3.6, -2)) + blush(at(3.4, 3), 1.7);
  }

  // motion: "reps" follows the breathing pacer, "rock" rolls gently, "sway" eases into the active pose and back.
  var FIG = {
    knees: { motion: "rock",
      a: { hd: [34, 72], sh: [46, 80], hip: [108, 83], kn: [94, 52], ft: [122, 44], el: [60, 81], hand: [92, 56] },
      draw: function (j) {
        return pillow(14, 79, 34, 10) + limb(curve(j.sh, [78, 84], j.hip)) + limb(line(j.hip, j.kn, j.ft)) +
          limb(line(j.el, j.hand)) + head(j.hd, 9, -90);
      } },
    tilt: { motion: "reps",
      a: { hd: [30, 72], sh: [42, 80], c1: [72, 82], c2: [92, 60], hip: [110, 83], kn: [136, 55], ft: [156, 87] },
      b: { c2: [94, 87], hip: [110, 84], kn: [138, 56] },
      draw: function (j) {
        return pillow(12, 79, 32, 10) + limb("M" + pt(j.sh) + " C" + pt(j.c1) + " " + pt(j.c2) + " " + pt(j.hip)) +
          limb(line(j.hip, j.kn, j.ft)) + limb(line([52, 85], [84, 88])) + head(j.hd, 9, -90);
      } },
    drops: { motion: "reps",
      a: { hd: [30, 72], hip: [110, 83], kn: [136, 55], ft: [156, 87], kn2: [133, 56] },
      b: { kn: [150, 71], kn2: [140, 62] },
      draw: function (j) {
        return pillow(12, 79, 32, 10) + limb(line(j.hip, j.kn2, j.ft), true) + limb(curve([42, 80], [76, 85], j.hip)) +
          limb(line(j.hip, j.kn, j.ft)) + limb(line([58, 81], [96, 86])) + head(j.hd, 9, -90);
      } },
    hipflexor: { motion: "sway",
      a: { hd: [96, 14], nk: [96, 26], hip: [98, 56], fk: [134, 58], el: [89, 47], hand: [98, 54] },
      b: { hd: [101, 15], nk: [101, 27], hip: [104, 58], fk: [137, 59], el: [94, 48], hand: [104, 56] },
      draw: function (j) {
        return pillow(70, 82, 24, 7) + limb(curve(j.nk, [j.nk[0] + 3, 42], j.hip)) + limb(line(j.hip, [80, 84], [50, 86])) +
          limb(line(j.hip, j.fk, [136, 86], [148, 86])) + limb(line([j.nk[0], j.nk[1] + 7], j.el, j.hand)) + head(j.hd, 9, 0);
      } },
    bridge: { motion: "reps",
      a: { sh: [40, 85], c: [67, 86], hip: [94, 84], kn: [126, 56] },
      b: { c: [70, 67], hip: [100, 57], kn: [131, 47] },
      draw: function (j) {
        return limb(curve(j.sh, j.c, j.hip)) + limb(line(j.hip, j.kn, [140, 87])) + limb(line([46, 86], [90, 87])) +
          head([28, 79], 8, -90);
      } },
    birddog: { motion: "reps",
      a: { hand: [64, 86], kn: [113, 86], ft: [140, 86] },
      b: { hand: [20, 45], kn: [141, 53], ft: [170, 51] },
      draw: function (j) {
        return limb(line([60, 56], [62, 87]), true) + limb(line([112, 56], [112, 87], [140, 87]), true) +
          limb(curve([60, 56], [86, 53], [112, 56])) + limb(line([60, 56], j.hand)) + limb(line([112, 56], j.kn, j.ft)) +
          head([50, 39], 8, 20, true);
      } },
    deadbug: { motion: "reps",
      a: { hand: [58, 42], kn: [104, 52], ft: [132, 52] },
      b: { hand: [24, 56], kn: [138, 78], ft: [172, 72] },
      draw: function (j) {
        return limb(line([58, 84], [58, 42]), true) + limb(line([104, 84], [104, 52], [132, 52]), true) +
          limb(line([40, 84], [104, 84])) + limb(line([58, 84], j.hand)) + limb(line([104, 84], j.kn, j.ft)) +
          head([28, 78], 8, -90);
      } },
    sideplank: { motion: "sway",
      a: { c: [110, 66], hand: [82, 70] },
      b: { c: [110, 60], hand: [82, 66] },
      draw: function (j) {
        return limb(curve([44, 50], j.c, [176, 87])) + limb(line([44, 50], [44, 87], [70, 87])) + limb(line([60, 54], j.hand)) +
          head([33, 37], 8, "front");
      } }
  };

  var lastPose = "";
  function drawFigure(id, m, tilt) {
    var key = id + m.toFixed(3) + tilt.toFixed(2);
    if (key === lastPose) return;
    lastPose = key;
    var f = FIG[id], body = $("figure-body");
    body.innerHTML = f.draw(mix(f.a, f.b, m));
    body.setAttribute("transform", tilt ? "rotate(" + tilt.toFixed(2) + " 78 86)" : "");
  }
  // Idle motion for timed holds, from seconds into the hold.
  function holdPose(motion, t) {
    if (motion === "rock") return { m: 0, tilt: 4 * Math.sin(2 * Math.PI * t / 5) };
    if (motion === "sway") return { m: (1 - Math.cos(2 * Math.PI * t / 6)) / 2, tilt: 0 };
    return { m: 0, tilt: 0 };
  }

  // ---------- routine (routine.js) ----------
  var R = window.Routine, EX = R.EX;
  var SPEED = Number(new URLSearchParams(location.search).get("speed")) || 1;
  var STEPS = R.buildSteps();
  var TOTAL = STEPS.reduce(function (a, s) { return a + s.dur; }, 0);
  var WORK_TOTAL = STEPS.reduce(function (a, s) { return a + (s.t === "work" ? s.dur : 0); }, 0);
  var DAYS_KEY = "mb-days";
  var RING_LENGTH = 295.31; // 2π × r=47, matches the ring's stroke-dasharray

  // ---------- helpers ----------
  function fmt(sec) { sec = Math.max(0, Math.ceil(sec)); return Math.floor(sec / 60) + ":" + R.pad(sec % 60); }
  function show(id) {
    ["start", "session", "done"].forEach(function (s) { $(s).hidden = s !== id; });
  }

  // ---------- week dots ----------
  function loadDays() { try { return JSON.parse(localStorage.getItem(DAYS_KEY) || "[]"); } catch (e) { return []; } }
  function markToday() {
    var days = loadDays(), k = R.dayKey(new Date());
    if (days.indexOf(k) < 0) days.push(k);
    days = days.slice(-60);
    try { localStorage.setItem(DAYS_KEY, JSON.stringify(days)); } catch (e) {}
  }
  function renderWeek(el) {
    el.innerHTML = R.weekDays(loadDays(), new Date()).map(function (d) {
      return '<div class="day' + (d.done ? " on" : "") + (d.today ? " today" : "") + '"><i></i>' + d.letter + "</div>";
    }).join("");
  }

  // ---------- sound (synthesised singing bowl) ----------
  var ctx = null, master = null;
  function initAudio() {
    if (ctx) { if (ctx.state !== "running") ctx.resume(); return; }

  var video = null, lock = null;

    }
